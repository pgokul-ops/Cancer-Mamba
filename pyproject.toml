[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcga-ov-mamba"
version = "0.1.0"
description = "Hierarchical Mamba pipeline for patient-level volumetric cancer imaging on TCGA-OV"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Cancer-Mamba Team" }
]
keywords = ["deep-learning", "mamba", "dicom", "oncology", "tcga-ov", "ct"]

dependencies = [
    # Core PyTorch with CUDA support matching NVIDIA driver (Driver 580.x, CUDA <= 13.0)
    # Target hardware: NVIDIA GeForce GTX 1650 (Turing cc 7.5, 4GB VRAM)
    "torch>=2.0.0",
    "torchvision>=0.15.0",

    # Primary DICOM -> 3D Volume reconstruction engine:
    # We select SimpleITK as the primary volume builder because it automatically
    # resolves 3D physical coordinates (ImagePositionPatient, ImageOrientationPatient,
    # slice thickness/spacing, and Hounsfield Unit rescale slope/intercept) and
    # performs robust resampling without manual slice-indexing bugs.
    "SimpleITK>=2.3.0",

    # Lightweight DICOM header parsing & inspection
    "pydicom>=2.4.0",

    # Neuroimaging & NIfTI support (secondary / inspection)
    "nibabel>=5.0.0",

    # Tabular and scientific computation
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",

    # Configuration & Utilities
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
# Mamba SSM CUDA kernels (Turing sm_75 note):
# Official pre-built wheels on PyPI support Ampere (sm_80+) and Hopper (sm_90+).
# On Turing (GTX 1650, compute capability 7.5), mamba-ssm requires compilation from source
# with a compatible local CUDA Toolkit (nvcc) and TORCH_CUDA_ARCH_LIST="7.5".
# For Stage 0-2, we utilize a PyTorch scan-based SSM fallback placeholder;
# hardware-accelerated mamba-ssm is revisited in Stage 3.
mamba = [
    "causal-conv1d>=1.2.0",
    "mamba-ssm>=1.2.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["preprocessing*", "datasets*", "models*", "heads*", "training*", "pretraining*", "evaluation*"]
